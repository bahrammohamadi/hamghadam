# ساخت و تست خودکار APK دیباگ در GitHub Actions
# محل نهایی این فایل: .github/workflows/android-apk.yml
# (توکن اتوماسیون این مخزن مجوز Workflows ندارد، پس این فایل باید یک بار
#  از طریق وب گیت‌هاب در مسیر درست commit شود.)

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test + build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Show toolchain versions
        working-directory: hamghadam-source/apps/android
        run: |
          java -version
          gradle --version

      - name: Run JVM unit tests
        working-directory: hamghadam-source/apps/android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: hamghadam-source/apps/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Show APK info
        if: success()
        run: ls -lh hamghadam-source/apps/android/app/build/outputs/apk/debug/

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hamghadam-debug-apk
          path: hamghadam-source/apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            hamghadam-source/apps/android/app/build/reports/**
            hamghadam-source/apps/android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
