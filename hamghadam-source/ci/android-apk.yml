# ساخت APK دیباگ در GitHub Actions
#
# این فایل باید در مسیر  .github/workflows/android-apk.yml  قرار بگیرد.
# دلیل اینکه مستقیماً آنجا نیست: توکن/اپ دسترسی نوشتن روی مسیر workflow را ندارد.
# راه ساده: در گیت‌هاب، Add file → Create new file و مسیر
#   .github/workflows/android-apk.yml
# را بساز، محتوای این فایل را جای‌گذاری کن و commit کن.
# سپس از تب Actions، workflow «Build Android APK» را اجرا کن (Run workflow).

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test + build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JVM unit tests
        working-directory: hamghadam-source/apps/android
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: hamghadam-source/apps/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: hamghadam-source/apps/android/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hamghadam-debug-apk
          path: hamghadam-source/apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
