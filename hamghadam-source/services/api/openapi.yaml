openapi: 3.1.0
info:
  title: Hamghadam API (starter contract)
  version: 0.1.0
  description: قرارداد اولیهٔ health و وظایف؛ احراز هویت و ذخیره‌سازی هنوز پیاده‌سازی نشده‌اند.
servers:
  - url: https://api.example.invalid/v1
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /tasks:
    get:
      operationId: listTasks
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Task page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Task' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { description: Authentication required }
    post:
      operationId: createTask
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTask' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '409': { description: Idempotency or version conflict }
        '401': { description: Authentication required }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateTask:
      type: object
      required: [workspaceId, title]
      properties:
        workspaceId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        dueAt: { type: [string, 'null'], format: date-time }
        timezone: { type: string, example: Asia/Tehran }
    Task:
      type: object
      required: [id, workspaceId, title, version]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        title: { type: string }
        dueAt: { type: [string, 'null'], format: date-time }
        timezone: { type: string }
        version: { type: integer, minimum: 1 }
        deletedAt: { type: [string, 'null'], format: date-time }
